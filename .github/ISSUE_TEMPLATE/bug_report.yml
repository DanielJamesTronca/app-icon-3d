name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes: { value: "Thanks for taking the time to report a bug." }
  - type: input
    id: version
    attributes: { label: Package and version, placeholder: "@danieljamestronca/app-icon-3d@0.1.0" }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Runtime, browser, and OS }
