name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:demo
      - run: pnpm pack:check
      - name: Verify packed packages install
        run: |
          for THREE_VERSION in 0.179.1 0.185.1; do
            INSTALL_DIR="/tmp/app-icon-3d-install-$THREE_VERSION"
            mkdir -p "$INSTALL_DIR"
            cd "$INSTALL_DIR"
            npm init -y
            npm install "$GITHUB_WORKSPACE"/.packs/*.tgz "three@$THREE_VERSION" react react-dom @react-three/fiber
            node --input-type=module -e "import { AppIcon3DCollection, createAppIconGeometry } from '@danieljamestronca/app-icon-3d'; console.log(typeof AppIcon3DCollection, createAppIconGeometry().getAttribute('position').count)"
            npx app-icon-3d --help
          done
