name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN_AVAILABLE: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.13.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, registry-url: https://registry.npmjs.org, cache: pnpm }
      # Changesets' stable pnpm publisher uses --no-git-checks, supported by npm 11.
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          # One-time bootstrap for the initial publish. This is removed after npm OIDC is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Confirm initial packages are public
        if: ${{ env.NPM_TOKEN_AVAILABLE == 'true' }}
        run: |
          npm access public @danieljamestronca/app-icon-3d
          npm access public @danieljamestronca/app-icon-3d-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
